[package]
name = "krc"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1", default-features = false, features = ["utils"] }
pollster = "0.4"
wgpu = "24"

[profile.release]
opt-level = 3
codegen-units = 1
lto = true
